<!-- @dsCard group="Brand" viewport="700x200" name="Logo on backgrounds" subtitle="Lockups are dark-text art: on navy, put the color lockup in a white panel or pair the mark with a Roboto wordmark." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-body)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.p{border-radius:var(--radius-md);height:128px;display:grid;place-items:center;position:relative}.tag{position:absolute;left:10px;bottom:8px;font-family:var(--font-display);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}.ok{color:var(--green-700)}.no{color:#ffd5c2}.chip{background:#fff;border-radius:var(--radius-md);padding:10px 16px;box-shadow:var(--shadow-md)}.wm{display:flex;align-items:center;gap:14px;color:#fff;font-family:var(--font-body);font-weight:500;font-size:21px;letter-spacing:.02em}.wm b{font-weight:500;color:var(--blue-300)}</style></head><body><div class="g">
<div class="p" style="background:var(--surface-subtle);border:1px solid var(--border-subtle)"><img src="../assets/logo-horizontal-color.png" style="height:34px"><span class="tag ok">Light surface — preferred</span></div>
<div class="p" style="background:var(--gradient-navy)"><span class="chip"><img src="../assets/logo-horizontal-color.png" style="height:28px;display:block"></span><span class="tag" style="color:var(--blue-200)">Navy — white panel</span></div>
<div class="p" style="background:var(--gradient-navy)"><span class="wm"><img src="../assets/mark-color.png" style="height:38px"><span><b>PRICE</b>REPORTER</span></span><span class="tag" style="color:var(--blue-200)">Navy — mark + Roboto wordmark</span></div>
</div></body></html>
