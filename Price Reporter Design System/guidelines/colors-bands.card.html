<div class="s" style="background:var(--surface-page);color:var(--text-muted);box-shadow:inset 0 0 0 1px var(--border-subtle)">white</div>
<div class="s" style="background:var(--surface-band);color:var(--neutral-700)">band grey</div>
<div class="s" style="background:var(--surface-inverse);color:#fff">navy band</div>
<div class="s" style="background:var(--gradient-hero);color:var(--blue-900)">hero wash</div>
</div></body></html>
