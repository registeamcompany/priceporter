<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Green / amber / red, each with a soft background and a strong text tone." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-body)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.b{border-radius:var(--radius-md);padding:12px;border:1px solid}.b b{font-family:var(--font-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px}.b code{font-size:11px;opacity:.8}.dot{display:inline-block;width:12px;height:12px;border-radius:99px;margin-right:6px;vertical-align:-1px}</style></head><body><div class="g">
<div class="b" style="background:var(--green-100);border-color:#c6e6d5;color:var(--green-700)"><b><span class="dot" style="background:var(--green-500)"></span>Success</b><code>--green-100 / 500 / 700</code></div>
<div class="b" style="background:var(--amber-100);border-color:#f2ddb0;color:var(--amber-700)"><b><span class="dot" style="background:var(--amber-500)"></span>Warning</b><code>--amber-100 / 500 / 700</code></div>
<div class="b" style="background:var(--red-100);border-color:#f2c9c3;color:var(--red-700)"><b><span class="dot" style="background:var(--red-500)"></span>Danger</b><code>--red-100 / 500 / 700</code></div>
</div></body></html>
