<!-- @dsCard group="Brand" viewport="700x230" name="Refresh theme" subtitle="data-theme=&quot;refresh&quot; — softer corners, quiet shadows, more air. For campaign pages, not the site." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-body)}.g{display:grid;grid-template-columns:1fr 1fr;gap:22px}.lab{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}.demo{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);padding:14px}.card h4{font:var(--type-h4);margin:0 0 6px;color:var(--text-strong)}.card p{font:var(--type-caption);color:var(--text-body);margin:0}.b{height:var(--control-h);padding:0 20px;border:2px solid var(--brand-accent);background:var(--brand-accent);color:#fff;border-radius:var(--radius-control);font:var(--type-button);letter-spacing:var(--tracking-label);text-transform:uppercase;align-self:flex-start}.tk{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle);margin-top:10px}</style></head><body>
<div class="g">
<div><div class="lab">Site (default)</div><div class="demo"><div class="card"><h4>GSA Contract Acquisition</h4><p>0px corners, no shadow, 96px section rhythm.</p></div><button class="b">Get consultation</button></div><div class="tk">--radius-card 0 · --shadow-sm none on cards</div></div>
<div data-theme="refresh"><div class="lab">Refresh (campaign)</div><div class="demo"><div class="card"><h4>GSA Contract Acquisition</h4><p>10px corners, quiet shadow, 112px rhythm, sentence-case headings.</p></div><button class="b">Get consultation</button></div><div class="tk">--radius-card 10px · --shadow-sm · --section-y 112px</div></div>
</div>
</body></html>
