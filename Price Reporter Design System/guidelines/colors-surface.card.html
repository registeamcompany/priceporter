<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces & borders" subtitle="Flat fills with 1px keylines. Orange borders mark CTAs; navy keylines box the stats band." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-body)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.s{height:96px;display:flex;align-items:flex-end;padding:9px;font-family:var(--font-display);font-size:10.5px;font-weight:700;color:var(--text-muted)}</style></head><body><div class="g">
<div class="s" style="background:var(--surface-page);border:1px solid var(--border-subtle)">page + subtle</div>
<div class="s" style="background:var(--surface-band);border:1px solid var(--border-default)">band + default</div>
<div class="s" style="background:#fff;border:2px solid var(--border-accent);color:var(--brand-accent)">accent border</div>
<div class="s" style="background:#fff;border:2px solid var(--border-brand);color:var(--brand-primary)">brand border</div>
<div class="s" style="background:var(--surface-inverse);color:#fff;border:1px solid var(--border-on-dark)">inverse + on-dark</div>
</div></body></html>
