<!-- @dsCard group="Spacing" viewport="700x170" name="Motion & states" subtitle="140ms controls, 200ms surfaces, no bounce, no lift. Hover = color inversion; the orange fill is the signature." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-body)}.g{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.b{height:var(--control-h);padding:0 20px;border:2px solid var(--brand-accent);background:#fff;color:var(--brand-accent);font:var(--type-button);letter-spacing:var(--tracking-label);text-transform:uppercase;transition:var(--transition-control);cursor:pointer}.b:hover{background:var(--brand-accent);color:#fff}.t{background:var(--tile-2);color:#fff;padding:14px 16px;font-family:var(--font-display);font-weight:700;font-size:13px;box-shadow:4px 4px 0 rgb(0 33 56 / .28);transition:var(--transition-control);cursor:pointer}.t:hover{background:var(--brand-accent)}.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);margin-top:14px;display:flex;gap:16px;flex-wrap:wrap}</style></head><body><div class="g"><button class="b">Hover: fills orange</button><div class="t">Tile hover: orange</div></div>
<div class="tk"><span>--duration-fast 140ms</span><span>--duration-base 200ms</span><span>--ease-standard cubic-bezier(.2,.6,.2,1)</span><span>no transform, no shadow change</span></div></body></html>
