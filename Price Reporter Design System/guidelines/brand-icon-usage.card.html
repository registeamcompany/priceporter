<!-- @dsCard group="Brand" viewport="700x170" name="Icon treatments" subtitle="Orange chevrons carry the brand. Blue squares only in product UI; inline glyphs inherit currentColor." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-body)}.row{display:flex;gap:30px;align-items:flex-start}.tile{width:44px;height:44px;display:grid;place-items:center;background:var(--blue-700);color:#fff}.i{background:currentColor;mask-size:contain;mask-position:center;mask-repeat:no-repeat;-webkit-mask-size:contain;-webkit-mask-position:center;-webkit-mask-repeat:no-repeat;display:block}code{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);display:block;margin-top:9px}</style></head><body><div class="row">
<div style="color:var(--brand-accent)"><span class="i" style="width:24px;height:24px;-webkit-mask-image:url(../assets/icons/chevron-right.svg);mask-image:url(../assets/icons/chevron-right.svg)"></span><code>values / FAQ / footer bullet</code></div>
<div><div class="tile"><span class="i" style="width:22px;height:22px;-webkit-mask-image:url(../assets/icons/settings.svg);mask-image:url(../assets/icons/settings.svg)"></span></div><code>product tile · 22px on #085185</code></div>
<div style="color:#fff;background:var(--tile-1);padding:10px"><span class="i" style="width:22px;height:22px;-webkit-mask-image:url(../assets/icons/circle-play.svg);mask-image:url(../assets/icons/circle-play.svg)"></span><code style="color:rgba(255,255,255,.75)">video affordance on hero tiles</code></div>
<div style="color:var(--text-muted);display:flex;align-items:center;gap:8px"><span class="i" style="width:17px;height:17px;-webkit-mask-image:url(../assets/icons/mail.svg);mask-image:url(../assets/icons/mail.svg)"></span><span style="font:var(--type-body)">inline · 16–17px</span></div>
</div></body></html>
