<div><code>--text-strong</code><span style="color:var(--text-strong);font-family:var(--font-display);font-weight:700">Hero headline / card titles</span></div>
<div><code>--text-heading</code><span style="color:var(--text-heading);font-family:var(--font-display);font-weight:700;text-transform:uppercase">Section heading</span></div>
<div><code>--text-body</code><span style="color:var(--text-body)">Default paragraph copy</span></div>
<div><code>--text-muted</code><span style="color:var(--text-muted)">Captions and metadata</span></div>
<div><code>--text-accent</code><span style="color:var(--text-accent);font-family:var(--font-display);font-weight:700">Numbers, chevrons, CTA text</span></div>
