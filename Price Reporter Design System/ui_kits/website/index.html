<!-- @startingPoint section="Website" subtitle="pricereporter.com marketing site: home, service page, article, contact" viewport="1280x820" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Price Reporter — GSA contract specialists</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--surface-page)}#root{min-height:100vh}.kit-switch{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;gap:6px;background:rgb(255 255 255 / .92);backdrop-filter:var(--overlay-blur);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);padding:5px;box-shadow:var(--shadow-lg)}.kit-switch button{border:0;background:none;cursor:pointer;font:var(--type-button);font-size:12px;color:var(--text-muted);padding:8px 13px;border-radius:var(--radius-pill)}.kit-switch button[data-on="true"]{background:var(--brand-primary);color:#fff}</style></head><body>
<div id="root"></div>
<script>window.PR_ICON_BASE='../../assets/icons/';window.PR_ASSET_BASE='../../assets/';</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="SiteChrome.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="ServicePage.jsx"></script>
<script type="text/babel" src="ArticlePage.jsx"></script>
<script type="text/babel" src="ContactPage.jsx"></script>
<script type="text/babel">
function Site(){
  const [route,setRoute] = React.useState('home');
  const go = (r) => { setRoute(r); window.scrollTo({top:0}); };
  const Page = { home: window.HomePage, gsa: window.ServicePage, services: window.ServicePage, article: window.ArticlePage, contact: window.ContactPage }[route] || window.HomePage;
  return (<>
    <window.SiteHeader route={route} onNavigate={go}/>
    <Page onNavigate={go}/>
    <window.SiteFooter onNavigate={go}/>
    <div className="kit-switch">
      {[['home','Home'],['gsa','GSA Contract'],['article','Article'],['contact','Contact']].map(([id,label])=>(
        <button key={id} data-on={route===id} onClick={()=>go(id)}>{label}</button>
      ))}
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script></body></html>
