<div id="root"></div>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="CatalogUploadScreen.jsx"></script>
<script type="text/babel" src="ComplianceScreen.jsx"></script>
<script type="text/babel">
const { Button, IconButton } = window.PriceReporterDesignSystem_2cd382;
const SCREENS = {
  dashboard: { title: 'Dashboard', subtitle: 'Acme Supply Co. · contract 47QSWA18D008F', Comp: () => <window.DashboardScreen/>, actions: <Button variant="primary" iconLeft="upload">Upload catalog</Button> },
  orders: { title: 'Dashboard', subtitle: 'Acme Supply Co. · contract 47QSWA18D008F', Comp: () => <window.DashboardScreen/>, actions: <Button variant="primary" iconLeft="upload">Upload catalog</Button> },
  catalog: { title: 'Catalog upload', subtitle: 'GSA Advantage · EDI transmission', Comp: () => <window.CatalogUploadScreen/>, actions: <Button variant="secondary" iconLeft="refresh-cw">Re-validate</Button> },
  contracts: { title: 'Compliance', subtitle: 'Contract 47QSWA18D008F · option period 2 of 4', Comp: () => <window.ComplianceScreen/>, actions: <Button variant="secondary" iconLeft="file-text">Request mod</Button> },
  compliance: { title: 'Compliance', subtitle: 'Contract 47QSWA18D008F · option period 2 of 4', Comp: () => <window.ComplianceScreen/>, actions: <Button variant="secondary" iconLeft="file-text">Request mod</Button> },
  reports: { title: 'Compliance', subtitle: 'Contract 47QSWA18D008F · option period 2 of 4', Comp: () => <window.ComplianceScreen/>, actions: null },
};
function App(){
  const [route,setRoute] = React.useState('dashboard');
  const s = SCREENS[route];
  return (<>
    <window.AppShell route={route} onNavigate={setRoute} title={s.title} subtitle={s.subtitle} actions={s.actions}>
      <s.Comp/>
    </window.AppShell>
    <div className="kit-switch">
      {[['dashboard','Dashboard'],['catalog','Catalog upload'],['compliance','Compliance']].map(([id,label])=>(
        <button key={id} data-on={route===id} onClick={()=>setRoute(id)}>{label}</button>
      ))}
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
